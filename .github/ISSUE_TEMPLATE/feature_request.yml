name: Feature request
description: Suggest an improvement for Remnant Bosses
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What would you like added or changed?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: How would this help players or pack makers?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Optional sketches, references, or related issues.
