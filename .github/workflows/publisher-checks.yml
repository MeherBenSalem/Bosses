name: Publisher checks

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "1.20.1/**"
      - "1.21.1/**"
      - "26.2/**"
      - "26.3/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publisher-checks.yml"
      - "**/src/main/resources/fabric.mod.json"
      - "**/src/main/resources/META-INF/*mods.toml"
  pull_request:
    paths:
      - "scripts/**"
      - "1.20.1/**"
      - "1.21.1/**"
      - "26.2/**"
      - "26.3/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publisher-checks.yml"
      - "**/src/main/resources/fabric.mod.json"
      - "**/src/main/resources/META-INF/*mods.toml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check publisher syntax
        run: |
          node --check scripts/release_metadata.mjs
          node --check scripts/upload_platforms.mjs
          node --check scripts/upload_platforms.test.mjs
      - name: Test metadata, offline preview and mocked upload transport
        run: node --test scripts/*.test.mjs

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { game: '1.20.1', java: '21' }
          - { game: '1.21.1', java: '21' }
          - { game: '26.2', java: '25' }
          - { game: '26.3', java: '25' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both loaders and run native crafting/loot regression
        run: |
          chmod +x "${{ matrix.game }}/gradlew"
          cd "${{ matrix.game }}"
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: verified-${{ matrix.game }}
          path: |
            ${{ matrix.game }}/*/build/libs/*.jar
