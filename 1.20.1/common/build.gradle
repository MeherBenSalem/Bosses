plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly "software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Exercise Minecraft 1.20.1's own recipe parser and crafting matcher.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
tasks.register('verifyCrafting', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + fileTree(layout.buildDirectory.dir('moddev/artifacts')) {
        include '*minecraft-resources*.jar'
    }
    mainClass = 'com.nightbeam.remnants.RecipeRegression'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version) }
    workingDir = rootProject.projectDir
    args project.findProperty('recipeResources') ?: file('src/main/resources').absolutePath
    if (project.hasProperty('recipeJar')) args project.property('recipeJar')
}
tasks.named('check') { dependsOn 'verifyCrafting' }
