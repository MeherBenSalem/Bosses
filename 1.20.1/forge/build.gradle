plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

// Supply the official -> SRG mapping to Mixin's processor. MDG exposes the
// reverse map; the processor needs this direction for production refmaps.
def mixinMappings = layout.buildDirectory.file('generated/mixin/namedToSrg.srg')
def mixinRefmap = layout.buildDirectory.file("generated/mixinResources/${mod_id}.refmap.json")
tasks.register('prepareMixinMappings') {
    dependsOn 'createMinecraftArtifacts'
    def inputMap = layout.buildDirectory.file('moddev/artifacts/intermediateToNamed.srg')
    inputs.file(inputMap)
    outputs.file(mixinMappings)
    doLast {
        def output = mixinMappings.get().asFile
        output.parentFile.mkdirs()
        output.text = inputMap.get().asFile.readLines().collect { line ->
            def p = line.split(' ')
            if (p[0] == 'MD:') return "MD: ${p[3]} ${p[4]} ${p[1]} ${p[2]}"
            if (p[0] in ['CL:', 'FD:', 'PK:']) return "${p[0]} ${p[2]} ${p[1]}"
            return line
        }.join('\n') + '\n'
    }
}
tasks.named('compileJava', JavaCompile) {
    dependsOn 'prepareMixinMappings'
    options.compilerArgs.addAll([
        "-AreobfSrgFile=${mixinMappings.get().asFile}",
        "-AoutRefMapFile=${mixinRefmap.get().asFile}",
        '-AdefaultObfuscationEnv=searge'
    ])
    doFirst { mixinRefmap.get().asFile.parentFile.mkdirs() }
}
sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/mixinResources')
tasks.named('processResources') { dependsOn 'compileJava' }

dependencies {
    compileOnly project(":common")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    // Published Forge mods are SRG-mapped; MDG remaps only `mod*` configurations.
    modImplementation "software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}"
    implementation files("libs/jauml-forge-1.20.1-2.1.1.jar")
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    ])
}
