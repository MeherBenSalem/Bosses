plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
// Eclipsed Realm walkthrough in a disposable world (tools/realm-runtime). Never part of a release jar.
if (providers.gradleProperty('realmRuntimeTest').isPresent()) {
    sourceSets {
        realmRuntimeTest {
            java.srcDir(rootProject.file('../tools/realm-runtime/src/v1211/java'))
            resources.srcDir(rootProject.file('../tools/realm-runtime/src/v1211/resources'))
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods {
            remnant_bosses { sourceSet sourceSets.main }
            realm_runtime_test { sourceSet sourceSets.realmRuntimeTest }
        }
        runs {
            realmRuntimeTestClient {
                client()
                source sourceSets.realmRuntimeTest
                setConfigName('Eclipsed Realm Disposable World Runtime Test')
                ideConfigGenerated(false)
                runDir('run')
                programArgs '--width', '1280', '--height', '800', '--username', 'RealmProbe'
            }
        }
    }
}
// Cinematic capture client for the promotional reel (tools/reel). Never part of a release jar.
if (providers.gradleProperty('reelDirector').isPresent()) {
    sourceSets {
        reelDirector {
            java.srcDir(rootProject.file('../tools/reel/src/v1211/java'))
            resources.srcDir(rootProject.file('../tools/reel/src/v1211/resources'))
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods {
            remnant_bosses { sourceSet sourceSets.main }
            reel_director { sourceSet sourceSets.reelDirector }
        }
        runs {
            reelClient {
                client()
                source sourceSets.reelDirector
                setConfigName('Remnant Bosses Reel Director')
                ideConfigGenerated(false)
                runDir('runs/reel')
                programArgs '--width', providers.gradleProperty('reelWidth').getOrElse('1080'),
                        '--height', providers.gradleProperty('reelHeight').getOrElse('1920'), '--username', 'Tarnished'
                vmArgs '-Xmx6G'
            }
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${geckolib_version}"
    modImplementation files("libs/jauml-fabric-1.21.1-2.1.1.jar")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}